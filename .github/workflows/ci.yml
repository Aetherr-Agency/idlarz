name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Generated docs and the pacing guard (IDL-9, IDL-17). `npm run docs:gen` reruns every report, including the full sim (about 8 minutes),
  # and the committed docs/generated must be exactly what it writes: a change to the game config or the sim that was not followed by
  # `npm run docs:gen` fails here. Then the sim baseline (docs/generated/sim-baseline.json) is compared with the copy on the branch the PR
  # targets, so regenerating the baseline cannot hide a pacing change: a guarded milestone (the first finish, the rebirths, castle 6/8/10, the
  # level and tile ladders) that moved by more than 15 % fails the PR. An intended change carries the `pacing-change` label (then re-run the
  # job): the guard still reports but does not block.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:gen
      - name: Generated docs are up to date
        run: |
          git add -N docs/generated
          git diff --exit-code docs/generated || { echo '::error::docs/generated is stale: run npm run docs:gen and commit the result'; exit 1; }
      - name: Pacing guard against the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'pacing-change') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:docs/generated/sim-baseline.json" 2>/dev/null; then
            echo "::notice::$BASE_REF has no docs/generated/sim-baseline.json yet (this PR introduces it): nothing to compare against"
            exit 0
          fi
          git show "origin/$BASE_REF:docs/generated/sim-baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          npx tsx scripts/pacing-guard.ts --base="$RUNNER_TEMP/base-baseline.json"
